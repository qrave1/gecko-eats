services:
  bot:
    image: ghcr.io/qrave1/gecko-eats:latest
    container_name: gecko-eats-bot
    restart: unless-stopped
    networks:
      - default
    env_file: .env

  notify:
    image: ghcr.io/qrave1/gecko-eats:latest
    profiles: [ "notify" ]
    container_name: gecko-eats-notify
    command: [ "./build", "notify" ]
    networks:
      - default
    env_file: .env

